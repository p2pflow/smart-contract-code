apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: order-helper-operations-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: order-helper
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              p2pflow.network/operations-monitor: "true"
      ports:
        - protocol: TCP
          port: 8080
  # The shipped runtime wires no external adapters. Keep every outbound path
  # closed until a separately reviewed read-only integration replaces this
  # scaffold under a later Council disposition.
  egress: []
