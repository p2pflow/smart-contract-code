apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-helper
  labels:
    app.kubernetes.io/name: order-helper
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-helper
  labels:
    app.kubernetes.io/name: order-helper
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: order-helper
  template:
    metadata:
      labels:
        app.kubernetes.io/name: order-helper
    spec:
      serviceAccountName: order-helper
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: order-helper
          # Example only. Replace with a reviewed image pinned by immutable digest.
          image: registry.example.invalid/p2pflow/order-helper:reviewed-build
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: order-helper-reviewed-config
                optional: false
          env:
            - name: HELPER_MODE
              value: shadow
            - name: ENABLE_TRANSACTION_SENDING
              value: "false"
            - name: COUNCIL_SCOPE_PASS
              value: "false"
            - name: CONTRACT_INTERFACE_VERIFIED
              value: "false"
            - name: BASE_SEPOLIA_DEPLOYMENT_VERIFIED
              value: "false"
            - name: CANARY_APPROVED
              value: "false"
            - name: HTTP_HOST
              value: 0.0.0.0
            - name: HTTP_PORT
              value: "8080"
            - name: PRIMARY_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: order-helper-runtime-secrets
                  key: primary-rpc-url
            - name: FALLBACK_RPC_URL
              valueFrom:
                secretKeyRef:
                  name: order-helper-runtime-secrets
                  key: fallback-rpc-url
            - name: KMS_KEY_REFERENCE
              valueFrom:
                secretKeyRef:
                  name: order-helper-runtime-secrets
                  key: kms-key-reference
            - name: DATABASE_SECRET_REFERENCE
              valueFrom:
                secretKeyRef:
                  name: order-helper-runtime-secrets
                  key: database-secret-reference
            - name: REDIS_SECRET_REFERENCE
              valueFrom:
                secretKeyRef:
                  name: order-helper-runtime-secrets
                  key: redis-secret-reference
          ports:
            - name: operations
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: operations
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: operations
            failureThreshold: 3
            periodSeconds: 15
            timeoutSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: operations
            failureThreshold: 2
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: temporary
              mountPath: /tmp
      volumes:
        - name: temporary
          emptyDir:
            sizeLimit: 64Mi
